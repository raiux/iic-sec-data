
name: IIC European ESEF discovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iic-esef-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover European filings
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          python scripts/discover_esef.py

      - name: Publish discovery results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/esef_discovery.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update European ESEF discovery"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo "ESEF discovery published."
