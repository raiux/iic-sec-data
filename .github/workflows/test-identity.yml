name: IIC integrated offline pipeline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit free validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Compile all integrated modules and tests
        run: python -m compileall -q scripts tests
      - name: Complete suite, no skips and network forbidden
        run: python -m scripts.run_offline_tests
      - name: Exercise public fixture through the CLI
        run: |
          python -m scripts.offline_pipeline --input tests/fixtures/identity-fictional.json --as-of 2026-11-03T00:00:00Z > /tmp/iic-b3-plan.json
          git diff --exit-code -- data tests/fixtures
