
name: IIC VINCI XBRL test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iic-vinci-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect VINCI financial facts
        run: |
          python scripts/test_vinci_xbrl.py

      - name: Publish inspection
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/vinci_xbrl_test.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Add VINCI XBRL inspection"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
