name: Normalize ESEF financials V5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_normalize_financials.py' -v
      - name: Normalize VINCI 2025
        run: python scripts/normalize_financials.py --input data/vinci_xbrl_test.json --output data/vinci_normalized_v2.json --year 2025 --company VINCI
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vinci_normalized_v2.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update VINCI normalized financials V5'
          git pull --rebase origin main
          git push origin HEAD:main
