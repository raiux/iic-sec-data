name: Private annual history persistence offline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Compile modules and tests
        run: python -m compileall -q scripts tests
      - name: Targeted annual foundation and persistence tests
        run: python -m unittest tests.test_annual_history tests.test_annual_history_store -v
      - name: Integrated suite with network denied and no skips
        run: python -m scripts.run_offline_tests
      - name: Preserve tracked source data and fixtures
        run: git diff --exit-code -- data tests/fixtures
      - name: Check whitespace
        run: git diff --check
