name: SEC offline regression tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies for complete suite
        run: python -m pip install -r requirements-validation.txt
      - name: SEC deterministic tests
        run: python -m unittest discover -s tests -p 'test_collect_sec.py' -v
      - name: All regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile Python
        run: python -m compileall -q scripts tests
