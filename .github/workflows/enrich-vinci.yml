name: IIC V5 - Enrich VINCI 2024-2025
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test enrichment
        run: python -m unittest discover -s tests -p 'test_enrich_vinci.py' -v
      - name: Fetch complete VINCI filing
        run: python scripts/collect_esef_full.py --output data/vinci_xbrl_full_2025.json
      - name: Enrich 2024 and 2025
        run: python scripts/enrich_vinci.py --input data/vinci_xbrl_full_2025.json --output data/vinci_enriched_2025.json
      - name: Commit enriched output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vinci_enriched_2025.json
          git diff --cached --quiet && exit 0
          git commit -m 'Enrich VINCI IFRS 2024-2025 with audit diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload full report temporarily
        uses: actions/upload-artifact@v4
        with:
          name: vinci-esef-full-2025
          path: data/vinci_xbrl_full_2025.json
          retention-days: 7
